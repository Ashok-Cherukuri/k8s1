---
apiVersion: v1
kind: Pod
metadata:
 name: tomcat-pod
 labels:
  type: web
spec:
 containers:
  - name: tomcat
    image: tomcat
    ports:
     - containerPort: 8080
       hostPort: 8080
    resources:
     requests:
      cpu: "200m"
      memory: "80Mi"
     limits:
      cpu: "500m"
      memory: "150Mi"
...
