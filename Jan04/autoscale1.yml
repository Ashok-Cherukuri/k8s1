---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: php-depl
 labels:
  app: php
spec:
 selector:
  matchLabels:
   app: php
 template:
   metadata:
    name: php-pod
    labels:
     app: php
   spec:
    containers:
     - name: php
       image: intelliqit/mynew
       ports:
        - containerPort: 80
       resources:
        requests:
         cpu: 200m
        limits:
         cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: php-service
  labels:
   app: php
spec:
 ports:
  - port: 80
 selector:
   app: php
... 
