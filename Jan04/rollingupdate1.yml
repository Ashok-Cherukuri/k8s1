---
apiVersion: apps/v1
kind: Deployment
metadata:
 name: nginx-depl
 labels:
  app: nginx
spec:
 replicas: 2
 selector:
  matchLabels:
   app: nginx
 template:
  metadata:
   name: nginx-pod
   labels:
    app: nginx
  spec:
   containers:
    - name: nginx
      image: nginx:1.26
      ports:
      -  containerPort: 80
         hostPort: 8080
...
