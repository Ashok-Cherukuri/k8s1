---
apiVersion: v1
kind: Service
metadata:
 name: headles-service
 labels:
  type: httpd
spec:
 clusterIP: None
 ports:
  - targetPort: 80
    port: 80
 selector:
  type: httpd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
 name: headles-statefulset
 labels:
  type: httpd
spec:
 replicas: 3
 selector:
  matchLabels:
   type: httpd
 template:
  metadata:
   name: httpd-pod
   labels:
    type: httpd
  spec:
   containers:
    - name: myhttpd
      image: httpd
      ports:
       - containerPort: 80
         hostPort: 8080
...
         
        
